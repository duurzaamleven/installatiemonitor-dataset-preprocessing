[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "im3-preprocessing"
version = "0.1.0"
description = "Preprocessing van de RVO Installatiemonitor 3.0-dataset naar getypeerde, herleidbare Parquet-tabellen (raw -> standardized -> cleaned -> derived)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
]
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "pyarrow>=17,<26",
]

[project.optional-dependencies]
weer = [
    # Eigen KNMI-ingest, zie ontwerp-preprocessing.md §7.3. Apache 2.0, energietransitie/henriterhofte.
    "needforheat-dutch-weather-software @ git+https://github.com/energietransitie/needforheat-dutch-weather-software.git",
    "scipy>=1.12,<2",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
]
gaskwaliteit = [
    # Werkelijke calorische-gaswaarde-ingest, zie ontwerp-preprocessing.md §12.3 en gaskwaliteit.py.
    "requests>=2.31,<3",
]
dev = [
    "pytest>=8",
    # Valideert datapackage.json (Frictionless Data Package v1) structureel; zie datapackage.py en
    # tests/test_datapackage.py. Optioneel in de zin dat de generatie zelf frictionless niet nodig
    # heeft (datapackage.py bouwt het bestand zelf, zonder deze afhankelijkheid); alleen de validatie
    # ertegen gebruikt het, en die test slaat zichzelf over als frictionless ontbreekt.
    "frictionless>=5,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/im3_preprocessing"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: test doet een echte netwerkcall naar KNMI (niet standaard; draai met -m network)",
]
